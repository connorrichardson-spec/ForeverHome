<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ForeverHome Walkthrough</title>
<style>
  :root { --bg:#0f1318; --fg:#eef1f4; --accent:#e0a458; --panel:rgba(15,19,24,.82); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:fixed; top:0; left:0; right:0; padding:max(8px, env(safe-area-inset-top)) 8px 8px;
    display:flex; flex-wrap:wrap; gap:6px; background:linear-gradient(var(--panel), transparent); z-index:5; }
  button, select { font:inherit; color:var(--fg); background:var(--panel); border:1px solid #fff3;
    border-radius:8px; padding:8px 12px; min-height:40px; }
  button.on { background:var(--accent); color:#111; border-color:var(--accent); }
  #help { position:fixed; bottom:max(10px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--panel); padding:6px 12px; border-radius:20px; font-size:12px; opacity:.9; z-index:5;
    pointer-events:none; text-align:center; max-width:90vw; }
  #stick { position:fixed; left:24px; bottom:max(50px, env(safe-area-inset-bottom)); width:110px; height:110px;
    border-radius:50%; border:2px solid #fff4; background:#fff1; z-index:4; display:none; pointer-events:none; }
  #nub { position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:#fff6; }
  #banner { position:fixed; top:56px; right:8px; background:var(--panel); padding:4px 10px; border-radius:6px;
    font-size:11px; color:#f6b; z-index:5; pointer-events:none; }
  #loading { position:fixed; inset:0; display:grid; place-items:center; z-index:9; background:var(--bg); }
</style>
</head>
<body>
<div id="loading">Loading ForeverHome…</div>
<div id="bar">
  <button id="mWalk" class="on">Walk</button>
  <button id="mDoll">Dollhouse</button>
  <button id="hq" title="Ambient occlusion (heavier on phones)">HQ</button>
  <span id="walkCtl" style="display:contents">
    <button data-lvl="basement">Basement</button>
    <button data-lvl="main">Main</button>
    <button data-lvl="upper">Upper</button>
    <select id="jump" aria-label="Jump to room"><option value="">Jump to room…</option></select>
  </span>
  <span id="dollCtl" style="display:none;contents">
    <button data-show="basement" class="on">Basement</button>
    <button data-show="main" class="on">Main</button>
    <button data-show="upper" class="on">Upper</button>
  </span>
</div>
<div id="banner">DRAFT v0 · placeholder sizes &amp; finishes</div>
<div id="stick"><div id="nub"></div></div>
<div id="help"></div>
<script>
addEventListener("error", (e) => { const l = document.getElementById("loading"); if (l) l.textContent = "Error: " + e.message; });
addEventListener("unhandledrejection", (e) => { const l = document.getElementById("loading"); if (l) l.textContent = "Error: " + (e.reason && e.reason.message || e.reason); });
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./viewer.js"></script>
</body>
</html>
